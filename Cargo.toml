[package]
name = "honrp"
version = "0.2.0"
edition = "2021"
rust-version = "1.70"
description = "Discord Rich Presence for Heroes of Newerth on Linux (Steam/Proton)"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
