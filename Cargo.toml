[package]
name = "honrp"
version = "0.3.0"
edition = "2021"
rust-version = "1.70"
description = "Discord Rich Presence for Heroes of Newerth on Linux and Windows"
license = "MIT"
repository = "https://github.com/NasirA1991/honrp"
readme = "README.md"
keywords = ["discord", "rich-presence", "heroes-of-newerth", "proton", "wine"]
categories = ["games", "command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
