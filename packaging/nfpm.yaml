name: honrp
arch: amd64
platform: linux
version: __VERSION__
section: utils
priority: optional
maintainer: Nasir <https://github.com/NasirA1991>
description: |
  Discord Rich Presence for Heroes of Newerth (Juvio) on Linux/Steam Proton.
vendor: honrp
homepage: https://github.com/NasirA1991/honrp
license: MIT
depends:
  - libxkbcommon
  - libwayland-client
  - libX11
  - libXcursor
  - libXi
  - libXrandr
  - vulkan-loader
  - hicolor-icon-theme
overrides:
  deb:
    depends:
      - libxkbcommon0
      - libwayland-client0
      - libx11-6
      - libxcursor1
      - libxi6
      - libxrandr2
      - libvulkan1
      - hicolor-icon-theme
  rpm:
    depends:
      - libxkbcommon
      - libwayland-client
      - libX11
      - libXcursor
      - libXi
      - libXrandr
      - vulkan-loader
      - hicolor-icon-theme
contents:
  - src: dist/honrp-linux-x86_64
    dst: /usr/bin/honrp
    file_info:
      mode: 0755
  - src: LICENSE
    dst: /usr/share/licenses/honrp/LICENSE
  - src: config.example.json
    dst: /usr/share/honrp/config.example.json
  - src: dist/honrp.desktop
    dst: /usr/share/applications/honrp.desktop
    file_info:
      mode: 0644
  - src: dist/icons/hicolor
    dst: /usr/share/icons/hicolor
    type: tree
