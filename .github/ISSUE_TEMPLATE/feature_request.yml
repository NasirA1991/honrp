name: Feature request
description: Suggest a state, label, or packaging improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What should change
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What is inaccurate/noisy today, or what would make setup easier?
