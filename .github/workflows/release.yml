name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: GUI build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev

      - name: Build static binary
        run: RUSTFLAGS="-C target-feature=+crt-static" cargo build --release --target x86_64-unknown-linux-gnu

      - name: Tarball + checksums
        run: |
          set -e
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/honrp dist/honrp-linux-x86_64
          cp lua/honrp_mod.lua dist/
          cp config.example.json dist/
          cp LICENSE dist/
          cp install.sh dist/install.sh
          (cd dist && sha256sum honrp-linux-x86_64 > honrp-linux-x86_64.sha256)
          tar -czf "honrp-${GITHUB_REF_NAME}-x86_64-linux.tar.gz" -C dist .
          mv "honrp-${GITHUB_REF_NAME}-x86_64-linux.tar.gz" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist

  packages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist-build
          path: dist

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Build .deb and .rpm
        run: |
          set -e
          export PATH="$HOME/go/bin:$PATH"
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          sed "s/__VERSION__/${GITHUB_REF_NAME#v}/" packaging/nfpm.yaml > /tmp/nfpm.yaml
          nfpm pkg -f /tmp/nfpm.yaml -p deb -t dist/
          nfpm pkg -f /tmp/nfpm.yaml -p rpm -t dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist

  arch:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist-build
          path: dist

      - name: Build Arch package in archlinux container
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bin_sha="$(sha256sum dist/honrp-linux-x86_64 | cut -d' ' -f1)"
          lic_sha="$(sha256sum LICENSE | cut -d' ' -f1)"
          cfg_sha="$(sha256sum config.example.json | cut -d' ' -f1)"
          work="$PWD/archbuild"
          rm -rf "$work"; mkdir -p "$work"
          cp dist/honrp-linux-x86_64 LICENSE config.example.json "$work/"
          cat > "$work/PKGBUILD" <<EOF
          pkgname=honrp-bin
          pkgver=$version
          pkgrel=1
          pkgdesc='Discord Rich Presence for Heroes of Newerth (Juvio) on Linux/Steam Proton'
          arch=('x86_64')
          url='https://github.com/NasirA1991/honrp'
          license=('MIT')
          provides=('honrp')
          conflicts=('honrp')
          options=('!strip')
          source=('honrp-linux-x86_64' 'LICENSE' 'config.example.json')
          sha256sums=('$bin_sha' '$lic_sha' '$cfg_sha')

          package() {
            install -Dm755 "\$srcdir/honrp-linux-x86_64" "\$pkgdir/usr/bin/honrp"
            install -Dm644 "\$srcdir/LICENSE" "\$pkgdir/usr/share/licenses/\$pkgname/LICENSE"
            install -Dm644 "\$srcdir/config.example.json" "\$pkgdir/usr/share/honrp/config.example.json"
          }
          EOF
          docker run --rm -v "$work:/work" -w /work archlinux:base-devel bash -c '
            pacman -Syu --noconfirm --needed base-devel >/dev/null
            useradd -m builder
            chown -R builder /work
            su builder -c "makepkg -f --nocheck"
          '
          cp "$work"/*.pkg.tar.zst dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist-arch
          path: dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Windows binary
        run: cargo build --release

      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "packaging\honrp.iss"

      - name: Package Windows zip
        run: |
          Compress-Archive -Path target/release/honrp.exe,README-WINDOWS.txt,LICENSE,config.example.json -DestinationPath "honrp-${env:GITHUB_REF_NAME}-windows-x86_64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            honrp-*-windows-x86_64.zip
            dist/honrp-setup-*.exe
          if-no-files-found: error

  publish:
    needs: [build, packages, arch, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-build
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: dist-arch
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: dist-windows
          path: dist

      - name: Checksums
        run: |
          cd dist
          ls -1 | grep -v '^checksums.txt$' | xargs sha256sum > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
