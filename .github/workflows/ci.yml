name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python3 -m compileall -q honrp.py demo_states.py tests

      - name: Python tests
        run: python3 tests/test_honrp.py

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Lua bridge tests (mocked engine)
        run: lua5.1 tests/test_lua_mod.lua honrp_mod.lua

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust tests
        run: cargo test --manifest-path rust/honrp/Cargo.toml

      - name: Release build
        run: cargo build --release --manifest-path rust/honrp/Cargo.toml
