name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: GUI build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test

      - name: Headless tests
        run: cargo test --no-default-features

      - name: Release build
        run: cargo build --release

  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Lua bridge tests (mocked engine)
        run: |
          lua5.1 tests/test_lua_mod.lua lua/honrp_mod.lua
          lua5.1 tests/test_lua_reload.lua lua/honrp_mod.lua

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Windows tests
        run: cargo test

      - name: Windows release build
        run: cargo build --release

      - name: Package Windows zip
        run: |
          Compress-Archive -Path target/release/honrp.exe,README-WINDOWS.txt,LICENSE,config.example.json -DestinationPath "honrp-windows-x86_64-ci.zip"

      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches.Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "packaging\honrp.iss"

      - uses: actions/upload-artifact@v4
        with:
          name: honrp-windows-x86_64-ci
          path: |
            honrp-windows-x86_64-ci.zip
            dist/honrp-setup-*.exe
          if-no-files-found: error
