name: AUR

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.3.2)"
        required: true
      pkgrel:
        description: "pkgrel (default 1; bump for packaging-only fixes)"
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p rel
          gh release download "${{ steps.tag.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --dir rel \
            --pattern 'honrp-*-x86_64-linux.tar.gz' --clobber

      - name: Generate AUR files
        env:
          PKGREL: ${{ inputs.pkgrel }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          ver="${tag#v}"
          tar_sha="$(sha256sum rel/honrp-*-x86_64-linux.tar.gz | cut -d' ' -f1)"

          pkgrel="${PKGREL:-1}"
          cat > PKGBUILD <<EOF
          # Maintainer: Nasir <https://github.com/NasirA1991>
          pkgname=honrp-bin
          pkgver=$ver
          pkgrel=$pkgrel
          pkgdesc='Discord Rich Presence for Heroes of Newerth (Juvio) on Linux/Steam Proton'
          arch=('x86_64')
          url='https://github.com/NasirA1991/honrp'
          license=('MIT')
          provides=('honrp')
          conflicts=('honrp')
          options=('!strip')
          source=(
            "honrp-\${pkgver}-x86_64-linux.tar.gz::https://github.com/NasirA1991/honrp/releases/download/v\${pkgver}/honrp-v\${pkgver}-x86_64-linux.tar.gz"
          )
          sha256sums=('$tar_sha')
          depends=('glibc' 'libxkbcommon' 'wayland' 'libx11' 'libxcursor' 'libxi' 'libxrandr' 'vulkan-icd-loader' 'hicolor-icon-theme')

          package() {
            tar -xzf "\$srcdir/honrp-\${pkgver}-x86_64-linux.tar.gz" -C "\$srcdir"
            install -Dm755 "\$srcdir/honrp-linux-x86_64" "\$pkgdir/usr/bin/honrp"
            install -Dm644 "\$srcdir/LICENSE" "\$pkgdir/usr/share/licenses/\$pkgname/LICENSE"
            install -Dm644 "\$srcdir/config.example.json" "\$pkgdir/usr/share/honrp/config.example.json"
            install -Dm644 "\$srcdir/honrp.desktop" "\$pkgdir/usr/share/applications/honrp.desktop"
            for size in 16x16 24x24 32x32 48x48 64x64 128x128 256x256 512x512; do
              install -Dm644 "\$srcdir/icons/hicolor/\$size/apps/honrp.png" "\$pkgdir/usr/share/icons/hicolor/\$size/apps/honrp.png"
            done
          }

          post_install() {
            cat <<'MSG'
          Finish setup as your user (not root):
            honrp install
          Restart Heroes of Newerth afterwards.
          MSG
          }
          EOF

          cat > .SRCINFO <<EOF
          pkgbase = honrp-bin
          	pkgdesc = Discord Rich Presence for Heroes of Newerth (Juvio) on Linux/Steam Proton
          	pkgver = $ver
          	pkgrel = $pkgrel
          	url = https://github.com/NasirA1991/honrp
          	arch = x86_64
          	license = MIT
          	provides = honrp
          	conflicts = honrp
          	options = !strip
          	source = honrp-$ver-x86_64-linux.tar.gz::https://github.com/NasirA1991/honrp/releases/download/v$ver/honrp-v$ver-x86_64-linux.tar.gz
          	sha256sums = $tar_sha
          	depends = glibc
          	depends = libxkbcommon
          	depends = wayland
          	depends = libx11
          	depends = libxcursor
          	depends = libxi
          	depends = libxrandr
          	depends = vulkan-icd-loader
          	depends = hicolor-icon-theme

          pkgname = honrp-bin
          EOF

      - name: Push to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_KEY:-}" ]; then
            echo "AUR_SSH_KEY is not configured; generated PKGBUILD/.SRCINFO but skipped the push."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/honrp-bin.git aur
          cp PKGBUILD .SRCINFO aur/
          cd aur
          git config user.name "honrp CI"
          git config user.email "honrp-ci@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "honrp-bin ${{ steps.tag.outputs.tag }}" || true
          git push origin master
